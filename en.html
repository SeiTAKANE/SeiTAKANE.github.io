<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sei TAKANE</title>
    <style>
        /* 全体の背景と基本設定（Y2Kスタイル） */
        body {
            background-color: #000;
            background-image: radial-gradient(#1a1a1a 1px, transparent 1px);
            background-size: 20px 20px;
            color: #00ffcc; /* サイバーグリーン */
            font-family: 'Courier New', 'Hiragino Kaku Gothic Pro', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        /* コンテンツを囲むコンテナ */
        .container {
            max-width: 700px;
            width: 100%;
            border: 4px double #ff00ff; /* マゼンタ二重線 */
            padding: 30px;
            background-color: rgba(0, 0, 0, 0.85);
            box-shadow: 10px 10px 0px #00ffff; /* シアンの影 */
        }

        /* 言語スイッチ */
        .language-switch {
            text-align: right;
            margin-bottom: 10px;
        }

        /* ヘッダーのレイアウト */
        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            border-bottom: 2px dashed #ff00ff;
            margin-bottom: 30px;
            padding-bottom: 20px;
        }

        /* プロフィール画像のスタイル */
        .profile-img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border: 3px solid #00ffff;
            outline: 3px solid #ff00ff;
            outline-offset: 5px;
            box-shadow: 8px 8px 0px #ff00ff;
            transform: rotate(-3deg); /* Y2Kらしい傾き */
            margin: 10px;
        }

        h1 {
            font-size: 2.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #00ffff;
            text-shadow: 3px 3px #ff00ff;
            margin: 10px 0;
            text-align: center;
        }

        h2 {
            display: inline-block;
            background: #ff00ff;
            color: #000;
            padding: 5px 15px;
            transform: skew(-15deg); /* 斜めカット */
            font-size: 1.2rem;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .section {
            margin-bottom: 35px;
        }

        /* リンクのスタイル */
        a {
            color: #fff;
            text-decoration: none;
            border-bottom: 1px solid #fff;
            transition: 0.3s;
        }

        a:hover {
            background-color: #00ffff;
            color: #000;
            border-bottom: none;
        }

        /* リストの装飾 */
        ul {
            list-style: none;
            padding-left: 0;
        }

        ul li {
            margin-bottom: 10px;
        }

        ul li::before {
            content: ">> ";
            color: #ff00ff;
            font-weight: bold;
        }

        p {
            font-size: 1.1rem;
        }

        /* レスポンシブ調整 */
        @media (min-width: 500px) {
            header {
                flex-direction: row;
                text-align: left;
            }
            h1 {
                text-align: left;
                margin-left: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="language-switch">
            <a href="index.html">日本語</a>
        </div>
        
        <header>
            <img src="profile.png" alt="Sei TAKANE" class="profile-img">
            <h1>Sei TAKANE</h1>
        </header>

        <main>
            <section class="section">
                <h2>Contact</h2>
                <p>Email: <a href="mailto:takanebeans@gmail.com">takanebeans@gmail.com</a></p>
            </section>
            
            <section class="section">
                <h2>CV</h2>
                <p><a href="cv/cv_en.pdf">Download CV (PDF)</a></p>
            </section>

            <section class="section">
                <h2>Research Replication</h2>
                <p><a href="https://github.com/SeiTAKANE/Researching">Access to Replication Files</a></p>
            </section>

            <section class="section">
                <h2>Links</h2>
                <ul>
                    <li><a href="https://github.com/SeiTAKANE">GitHub</a></li>
                    <li><a href="https://www.linkedin.com/in/sei-takane-048122288/">LinkedIn</a></li>
                    <li><a href="https://researchmap.jp/sei_takane">researchmap</a></li>
                    <li><a href="https://x.com/takanebeans">X</a></li>
                    <li><a href="https://note.com/stkn_0406">note</a></li>
                </ul>
            </section>
        </main>
    </div>
</body>
</html>
