<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高根晴 (Sei TAKANE)</title>
    <style>
        /* --- 既存のスタイルを維持しつつ、以下を追加・修正 --- */
        body {
            background-color: #000;
            background-image: radial-gradient(#1a1a1a 1px, transparent 1px);
            background-size: 20px 20px;
            color: #00ffcc;
            font-family: 'Courier New', 'Hiragino Kaku Gothic Pro', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 700px;
            width: 100%;
            border: 4px double #ff00ff;
            padding: 30px;
            background-color: rgba(0, 0, 0, 0.85);
            box-shadow: 10px 10px 0px #00ffff;
        }

        /* ヘッダーのレイアウト調整 */
        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            border-bottom: 2px dashed #ff00ff;
            margin-bottom: 30px;
            padding-bottom: 20px;
        }

        /* プロフィール画像のスタイル */
        .profile-img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border: 3px solid #00ffff;
            outline: 3px solid #ff00ff; /* 二重カラーの枠線 */
            outline-offset: 5px;
            box-shadow: 8px 8px 0px #ff00ff;
            /* Y2Kらしいちょっとした回転 */
            transform: rotate(-3deg);
            margin: 10px;
        }

        h1 {
            font-size: 2.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #00ffff;
            text-shadow: 3px 3px #ff00ff;
            margin: 10px 0;
            text-align: center;
        }

        /* --- 以下のスタイルは前回と同様 --- */
        h2 {
            display: inline-block;
            background: #ff00ff;
            color: #000;
            padding: 5px 15px;
            transform: skew(-15deg);
            font-size: 1.2rem;
            margin-bottom: 15px;
        }
        .section { margin-bottom: 35px; }
        .language-switch { text-align: right; margin-bottom: 10px; }
        a { color: #fff; text-decoration: none; border-bottom: 1px solid #fff; transition: 0.3s; }
        a:hover { background-color: #00ffff; color: #000; border-bottom: none; }
        ul { list-style: none; padding-left: 0; }
        ul li { margin-bottom: 10px; }
        ul li::before { content: ">> "; color: #ff00ff; font-weight: bold; }
        p { font-size: 1.1rem; }

        /* タブレット・PC向けのレイアウト調整 */
        @media (min-width: 500px) {
            header {
                flex-direction: row;
                text-align: left;
            }
            h1 {
                text-align: left;
                margin-left: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="language-switch">
            <a href="en.html">English</a>
        </div>
        
        <header>
            <img src="profile.png" alt="高根晴" class="profile-img">
            <h1>高根晴<br>(Sei TAKANE)</h1>
        </header>

        <main>
            <section class="section">
                <h2>連絡先</h2>
                <p>Email: <a href="mailto:takanebeans@gmail.com">takanebeans@gmail.com</a></p>
            </section>
            
            <section class="section">
                <h2>CV</h2>
                <p><a href="cv/cv_jp.pdf">Download CV</a></p>
            </section>

            <section class="section">
                <h2>研究レプリケーション</h2>
                <p><a href="https://github.com/SeiTAKANE/Researching">レプリケーションファイルにアクセス</a></p>
            </section>

            <section class="section">
                <h2>リンク</h2>
                <ul>
                    <li><a href="https://www.linkedin.com/in/sei-takane-048122288/">LinkedIn</a></li>
                    <li><a href="https://github.com/SeiTAKANE">GitHub</a></li>
                    <li><a href="https://researchmap.jp/sei_takane">researchmap</a></li>
                    <li><a href="https://x.com/takanebeans">X</a></li>
                    <li><a href="https://note.com/stkn_0406">note</a></li>
                </ul>
            </section>
        </main>
    </div>
</body>
</html>
